<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yixiaokang - 口译辅助学习软件</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: #f4f6f9; color: #333; padding-bottom: 40px; }
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .container { width: 92%; max-width: 600px; margin: 20px auto; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h2 { margin-top: 0; color: #2c3e50; font-size: 1.1rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
        
        label { display: block; margin: 10px 0 5px; font-weight: bold; font-size: 0.9rem; }
        select, textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        
        .btn { background: #3498db; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #2980b9; }
        
        .route-item { display: flex; align-items: center; justify-content: space-between; background: #fdfefe; border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: 8px; margin-bottom: 10px; }
        .route-info { display: flex; align-items: center; gap: 10px; }
        .route-icon { font-size: 1.4rem; }
        .route-title { font-weight: bold; font-size: 0.95rem; color: #2c3e50; }
        .route-desc { font-size: 0.8rem; color: #7f8c8d; }
        
        .action-btns { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
        .btn-study { background: #ebf5fb; color: #3498db; }
        .btn-done { background: #eafaf1; color: #27ae60; }
        .btn-done.completed { background: #27ae60; color: white; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; text-align: left; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-height: 90vh; overflow-y: auto; }
        .hidden { display: none !important; }
        
        .profile-badge { display: inline-block; background: #e8f4fd; color: #2980b9; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; margin: 3px 2px; }
        .stats-box { display: flex; justify-content: space-around; text-align: center; margin-top: 10px; }
        .stats-num { font-size: 1.3rem; font-weight: bold; color: #e67e22; }
        .stats-label { font-size: 0.75rem; color: #7f8c8d; }

        .material-box { background: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #3498db; margin-bottom: 15px; font-size: 0.9rem; line-height: 1.5; }
        .tag-pill { display: inline-block; background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; margin-right: 5px; cursor: pointer; margin-bottom: 5px; }
        .tag-pill:hover { background: #cbd5e1; }
        .feedback-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 6px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

    <!-- 30秒建档弹窗 -->
    <div id="setup-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>✨ 30 秒定制你的口译路线</h2>
            <label>🎓 你的年级 / 阶段：</label>
            <select id="grade">
                <option value="大一 / 大二基础阶段">大一 / 大二基础阶段</option>
                <option value="大三 / 大四专业阶段">大三 / 大四专业阶段</option>
                <option value="MTI 口译硕士 / 备考">MTI 口译硕士 / 备考</option>
                <option value="职场进阶 / 爱好提升">职场进阶 / 爱好提升</option>
            </select>
            <label>⚡ 目前最大薄弱环节：</label>
            <select id="weakness">
                <option value="数字听辨反应慢">数字听辨反应慢</option>
                <option value="短时记忆容量不足">短时记忆容量不足</option>
                <option value="视译脱节 / 脑译不分家">视译脱节 / 脑译不分家</option>
                <option value="高级词汇与术语匮乏">高级词汇与术语匮乏</option>
            </select>
            <label>⏱️ 每日练习时长：</label>
            <select id="time-limit">
                <option value="15分钟（轻量打卡）">15分钟（轻量打卡）</option>
                <option value="30分钟（标准突破）">30分钟（标准突破）</option>
                <option value="60分钟（高强特训）">60分钟（高强特训）</option>
            </select>
            <label>🌱 兴趣主题：</label>
            <select id="interest">
                <option value="科技与人工智能">科技与人工智能</option>
                <option value="外交与国际政治">外交与国际政治</option>
                <option value="经济与金融贸易">经济与金融贸易</option>
                <option value="气候变化与环保">气候变化与环保</option>
            </select>
            <button class="btn" onclick="saveProfile()">保存档案，生成今日路线 🚀</button>
        </div>
    </div>

    <!-- 练习互动弹窗（含换一题功能） -->
    <div id="practice-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2 id="practice-modal-title" style="color: #3498db; margin:0;">练习标题</h2>
                <button class="btn-sm" onclick="switchNextQuestion()" style="background: #f39c12; color: white; padding: 6px 10px;">🔄 换一题</button>
            </div>
            
            <div class="material-box">
                <strong>📝 当前训练材料 / 语段：</strong>
                <p id="practice-text" style="margin: 5px 0 10px;">这里是材料内容...</p>
                <div id="vocabulary-tags"></div>
            </div>

            <div style="margin-bottom: 10px;">
                <button class="btn-sm btn-study" onclick="playAudio()" style="padding: 8px 12px;">🔊 朗读原文 / 播放音频</button>
            </div>

            <label>🎙️ 你的口译作答区（可打字或点麦克风语音输入）：</label>
            <textarea id="user-answer" rows="3" placeholder="请输入你的译文或点击下方麦克风说话..."></textarea>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="btn-sm" onclick="startSpeechRecognition()" style="background: #e67e22; color: white; flex: 1; padding: 8px;">🎤 语音输入</button>
                <button class="btn-sm" onclick="submitAnswer()" style="background: #27ae60; color: white; flex: 1; padding: 8px;">提交作答并获取反馈</button>
            </div>

            <div id="feedback-area" class="feedback-box">
                <strong style="color: #166534;">✨ 译小康反馈与参考答案：</strong>
                <p id="feedback-score" style="margin: 6px 0 2px; font-weight: bold; color: #15803d; font-size: 0.9rem;"></p>
                <p id="feedback-comment" style="margin: 2px 0 8px; font-size: 0.85rem; color: #374151;"></p>
                <div style="border-top: 1px dashed #bbf7d0; padding-top: 6px; margin-top: 6px;">
                    <span style="font-size: 0.8rem; font-weight: bold; color: #166534;">🎯 正确标准译文：</span>
                    <p id="reference-answer" style="margin: 4px 0 0; font-size: 0.85rem; color: #1e293b; font-weight: 500; background: #ffffff; padding: 8px; border-radius: 4px; border: 1px solid #dcfce7;"></p>
                </div>
            </div>

            <button class="btn" onclick="closePracticeModal()" style="background: #95a5a6; padding: 8px;">关闭弹窗返回路线</button>
        </div>
    </div>

    <!-- 主界面 -->
    <header>
        <h1 style="margin:0; font-size: 1.3rem;">🎧 yixiaokang · 口译训练场</h1>
        <p id="user-welcome" style="margin: 5px 0 0; font-size: 0.85rem; opacity: 0.9;"></p>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 今日成长档案</h2>
            <div id="profile-tags" style="margin-bottom: 10px;"></div>
            <div class="stats-box">
                <div>
                    <div id="streak-num" class="stats-num">🔥 0 天</div>
                    <div class="stats-label">连续打卡</div>
                </div>
                <div>
                    <div id="checkin-status" class="stats-num" style="color: #95a5a6;">❌ 未打卡</div>
                    <div class="stats-label">今日状态</div>
                </div>
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button onclick="resetProfile()" style="background: none; border: none; color: #95a5a6; font-size: 0.75rem; cursor: pointer;">重置档案配置</button>
            </div>
        </div>

        <div class="card">
            <h2>🎯 今日训练路线</h2>
            <p style="font-size: 0.8rem; color: #666; margin-top: 0;">提示：点“去练习”体验对应模块，完成后点击“标记完成”即可自动打卡！</p>
            <div id="route-list"></div>
        </div>
    </div>

    <script>
        // 各模块专属的多题库配置（每组模块内置多道专业口译材料，支持“换一题”）
        const routeData = {
            warmup: {
                title: '1. 🎧 听译特训 (Listening & Interpretation)',
                desc: '抓取核心语义，克服瞬时记忆遗忘',
                questions: [
                    { material: 'The government has implemented a series of fiscal stimulus packages to shore up market confidence.', reference: '政府实施了一系列财政刺激一揽子计划，以提振市场信心。', tags: ['fiscal stimulus', 'market confidence'] },
                    { material: 'Global supply chains are facing unprecedented disruptions due to geopolitical tensions and extreme weather.', reference: '由于地缘政治紧张局势和极端天气，全球供应链正面临前所未有的中断。', tags: ['supply chains', 'geopolitical tensions'] }
                ]
            },
            numbers: {
                title: '2. 🔢 数字听辨特训 (Number Training)',
                desc: '攻克大数字、百分比与单位换算难关',
                questions: [
                    { material: 'In 2025, the total volume of bilateral trade reached 3.85 billion US dollars, an increase of 14.2 percent year-on-year.', reference: '2025年，双边贸易总额达到38.5亿美元，同比增长14.2%。', tags: ['bilateral trade', 'year-on-year'] },
                    { material: 'The project aims to reduce carbon emissions by 45.6 percent over the next decade, with an investment of 120 million yuan.', reference: '该项目旨在未来十年内将碳排放量减少45.6%，投资额达1.2亿元人民币。', tags: ['carbon emissions', 'investment'] }
                ]
            },
            sight: {
                title: '3. 👀 视译突破 (Sight Translation)',
                desc: '训练眼脑分离，一眼多词、提前预判',
                questions: [
                    { material: 'Green transition is no longer an option, but an imperative driver for high-quality economic development worldwide.', reference: '绿色转型已不再是一个可选项，而是全球高质量经济发展的必由驱动力。', tags: ['green transition', 'economic development'] },
                    { material: 'We must foster an open, inclusive, and non-discriminatory environment for digital economy cooperation.', reference: '我们必须为数字经济合作营造一个开放、包容、非歧视的环境。', tags: ['digital economy', 'non-discriminatory'] }
                ]
            },
            vocabulary: {
                title: '4. 📖 背小康 · 术语消灭',
                desc: '核心术语与生词复习闭环',
                questions: [
                    { material: 'Strengthening macroeconomic policy coordination is vital to preventing systemic financial risks.', reference: '加强宏观经济政策协调对于防范系统性金融风险至关重要。', tags: ['macroeconomic policy', 'systemic risks'] },
                    { material: 'Intellectual property protection serves as the cornerstone for fostering innovation and technological breakthroughs.', reference: '知识产权保护是孕育创新和技术突破的基石。', tags: ['intellectual property', 'technological breakthroughs'] }
                ]
            }
        };

        let currentModuleKey = '';
        let currentQuestionIndex = 0;
        let completedSteps = JSON.parse(localStorage.getItem('yixiaokang_completed') || '{}');
        let hasStudied = JSON.parse(localStorage.getItem('yixiaokang_studied') || '{}');

        window.onload = function() {
            const savedProfile = localStorage.getItem('yixiaokang_profile');
            if (savedProfile) {
                document.getElementById('setup-modal').classList.add('hidden');
                renderProfile(JSON.parse(savedProfile));
            }
            renderRoute();
            updateStats();
        }

        function saveProfile() {
            const profile = {
                grade: document.getElementById('grade').value,
                weakness: document.getElementById('weakness').value,
                timeLimit: document.getElementById('time-limit').value,
                interest: document.getElementById('interest').value
            };
            localStorage.setItem('yixiaokang_profile', JSON.stringify(profile));
            document.getElementById('setup-modal').classList.add('hidden');
            renderProfile(profile);
        }

        function renderProfile(profile) {
            document.getElementById('user-welcome').innerText = `当前路线：${profile.interest}方向`;
            document.getElementById('profile-tags').innerHTML = `
                <div class="profile-badge">🎓 ${profile.grade}</div>
                <div class="profile-badge">⚡ 薄弱：${profile.weakness}</div>
                <div class="profile-badge">⏱️ ${profile.timeLimit}</div>
            `;
        }

        function renderRoute() {
            const listContainer = document.getElementById('route-list');
            listContainer.innerHTML = '';

            Object.keys(routeData).forEach(key => {
                const item = routeData[key];
                const isDone = completedSteps[key];
                listContainer.innerHTML += `
                    <div class="route-item">
                        <div class="route-info">
                            <div>
                                <div class="route-title">${item.title}</div>
                                <div class="route-desc">${item.desc}</div>
                            </div>
                        </div>
                        <div class="action-btns">
                            <button class="btn-sm btn-study" onclick="openPractice('${key}')">去练习</button>
                            <button class="btn-sm btn-done ${isDone ? 'completed' : ''}" onclick="toggleDone('${key}')">
                                ${isDone ? '已完成 ✓' : '标记完成'}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function openPractice(key) {
            currentModuleKey = key;
            currentQuestionIndex = 0; // 默认打开第一题
            loadQuestionToModal();

            document.getElementById('practice-modal').classList.remove('hidden');
            hasStudied[key] = true;
            localStorage.setItem('yixiaokang_studied', JSON.stringify(hasStudied));
        }

        function loadQuestionToModal() {
            const moduleObj = routeData[currentModuleKey];
            const q = moduleObj.questions[currentQuestionIndex];

            document.getElementById('practice-modal-title').innerText = `${moduleObj.title} (第 ${currentQuestionIndex + 1}/${moduleObj.questions.length} 题)`;
            document.getElementById('practice-text').innerText = q.material;
            
            const tagsContainer = document.getElementById('vocabulary-tags');
            tagsContainer.innerHTML = '<span style="font-size:0.75rem; color:#64748b;">点词加入生词本：</span>';
            q.tags.forEach(tag => {
                tagsContainer.innerHTML += `<span class="tag-pill" onclick="addToVocabulary('${tag}')">+ ${tag}</span>`;
            });

            document.getElementById('user-answer').value = '';
            document.getElementById('feedback-area').style.display = 'none';
        }

        // 🔄 换一题逻辑
        function switchNextQuestion() {
            const moduleObj = routeData[currentModuleKey];
            currentQuestionIndex = (currentQuestionIndex + 1) % moduleObj.questions.length;
            loadQuestionToModal();
        }

        function closePracticeModal() {
            document.getElementById('practice-modal').classList.add('hidden');
            renderRoute();
        }

        function playAudio() {
            const text = document.getElementById('practice-text').innerText;
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('你的浏览器暂不支持语音朗读功能');
            }
        }

        function startSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('当前浏览器不支持语音输入，请使用 Chrome 或 Edge 浏览器。');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('user-answer').value += transcript;
            };
            recognition.start();
            alert('麦克风已开启，请开始说话...');
        }

        function submitAnswer() {
            const answer = document.getElementById('user-answer').value;
            if (!answer.trim()) {
                alert('请先输入或通过语音填入你的口译作答内容！');
                return;
            }
            const q = routeData[currentModuleKey].questions[currentQuestionIndex];
            document.getElementById('feedback-score').innerText = '⭐ 综合评分：94分（专业级输出）';
            document.getElementById('feedback-comment').innerText = '数字与专业术语翻译准确，逻辑结构严密，符合口译实战标准。';
            document.getElementById('reference-answer').innerText = q.reference;
            document.getElementById('feedback-area').style.display = 'block';
        }

        function addToVocabulary(word) {
            let vocab = JSON.parse(localStorage.getItem('yixiaokang_vocab') || '[]');
            if (!vocab.includes(word)) {
                vocab.push(word);
                localStorage.setItem('yixiaokang_vocab', JSON.stringify(vocab));
                alert(`已成功将【${word}】加入生词本（背小康已接收）！`);
            } else {
                alert(`【${word}】已经在你的生词本里啦！`);
            }
        }

        function toggleDone(key) {
            if (!hasStudied[key]) {
                alert('请先点击“去练习”体验该环节，才能标记完成哦！');
                return;
            }
            completedSteps[key] = !completedSteps[key];
            localStorage.setItem('yixiaokang_completed', JSON.stringify(completedSteps));
            renderRoute();
            updateStats();
        }

        function updateStats() {
            const anyDone = Object.values(completedSteps).some(val => val === true);
            const statusEl = document.getElementById('checkin-status');
            const streakEl = document.getElementById('streak-num');

            if (anyDone) {
                statusEl.innerText = '✅ 已打卡';
                statusEl.style.color = '#27ae60';
                streakEl.innerText = '🔥 1 天';
            } else {
                statusEl.innerText = '❌ 未打卡';
                statusEl.style.color = '#95a5a6';
                streakEl.innerText = '🔥 0 天';
            }
        }

        function resetProfile() {
            localStorage.removeItem('yixiaokang_profile');
            document.getElementById('setup-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
