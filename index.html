<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yixiaokang · 口译辅助学习软件</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
        }

        header p {
            margin: 0.5rem 0 0;
            opacity: 0.8;
            font-size: 0.95rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 1.3rem;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 0.5rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
            margin-right: 0.5rem;
            margin-top: 0.5rem;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success-color);
        }

        .tag-pill {
            display: inline-block;
            background: #e1f5fe;
            color: #0288d1;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-right: 0.4rem;
        }

        .feedback-area {
            background: #f1f8e9;
            border-left: 4px solid var(--success-color);
            padding: 1rem;
            margin-top: 1rem;
            display: none;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-top: 0.5rem;
            box-sizing: border-box;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.hidden {
            display: none;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }

        .modal-content input, .modal-content select {
            width: 100%;
            padding: 0.5rem;
            margin: 0.5rem 0 1rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎧 yixiaokang · 口译辅助学习软件</h1>
        <p>顺句驱动、数字听辨与实战模拟训练平台</p>
    </header>

    <div class="container">
        <!-- 连续打卡与档案概览 -->
        <div class="card">
            <h2>📊 学习档案与今日打卡</h2>
            <p>打卡状态：<span id="checkin-status" style="font-weight: bold; color: #95a5a6;">❌ 未打卡</span></p>
            <button class="btn" onclick="resetProfile()">修改配置档案</button>
        </div>

        <!-- 模块一：听译逐句特训 -->
        <div class="card">
            <h2>🎧 听译逐句特训 (Yi Xiaokang)</h2>
            <div id="sentence-progress" style="font-weight: bold; margin-bottom: 0.5rem; color: var(--accent-color);">加载中...</div>
            <p id="current-sentence-text" style="font-size: 1.1rem; background: #fafafa; padding: 1rem; border-radius: 4px;"></p>
            <div id="listening-tags" style="margin-bottom: 0.5rem;"></div>
            
            <button class="btn" onclick="playCurrentSentence()">🔊 朗读英文句子</button>
            <button class="btn" onclick="nextSentence()">下一句</button>
            <button class="btn" onclick="switchNextArticle()">切换文章</button>

            <textarea id="listening-user-answer" placeholder="请键入或口述你的中文译文..."></textarea>
            <button class="btn btn-success" onclick="submitListeningAnswer()">提交批改</button>
            <button class="btn" onclick="toggleDone('listening')">标记此模块已完成</button>

            <div id="listening-feedback-area" class="feedback-area">
                <h4 id="listening-feedback-score" style="margin: 0 0 0.5rem; color: var(--success-color);"></h4>
                <p id="listening-feedback-comment" style="margin: 0 0 0.5rem;"></p>
                <p style="margin: 0; font-size: 0.9rem;"><strong>参考译文：</strong><span id="listening-reference-answer"></span></p>
            </div>
        </div>
    </div>

    <!-- 30秒建档弹窗 -->
    <div id="setup-modal" class="modal">
        <div class="modal-content">
            <h2>欢迎使用 yixiaokang</h2>
            <p>请简单配置您的口译学习偏好：</p>
            <label>当前年级/水平：</label>
            <select id="setup-level">
                <option value="undergrad">本科英语专业 / 口译初学者</option>
                <option value="mtI">MTI 口译硕士 / 进阶者</option>
                <option value="pro">职业口译员 / 备考高翻</option>
            </select>
            <label>DeepSeek API Key (可选，用于本地拓展)：</label>
            <input type="password" id="setup-key" placeholder="sk-...">
            <button class="btn btn-success" style="width: 100%;" onclick="saveProfile()">保存并开始训练</button>
        </div>
    </div>

    <script>
        const listeningArticles = [
            {
                title: "经济全球化与科技创新",
                sentences: [
                    { en: "In recent years, artificial intelligence has profoundly reshaped the global economic landscape.", zh: "近年来，人工智能深刻重塑了全球经济格局。", tags: ["AI", "经济"] },
                    { en: "We must foster an open environment for scientific and technological cooperation.", zh: "我们必须营造开放的科技合作环境。", tags: ["科技合作"] }
                ]
            },
            {
                title: "绿色发展与气候变化",
                sentences: [
                    { en: "Achieving carbon neutrality requires a fundamental transformation of our energy systems.", zh: "实现碳中和需要对能源系统进行根本性变革。", tags: ["碳中和", "环保"] }
                ]
            }
        ];

        let currentArticleIndex = 0;
        let currentSentenceIndex = 0;
        let completedSteps = { listening: false, numbers: false, retell: false, sight: false };

        window.onload = function() {
            const profile = localStorage.getItem('yixiaokang_profile');
            if (!profile) {
                document.getElementById('setup-modal').classList.remove('hidden');
            }
            loadListeningSentence();
            updateStats();
        };

        function saveProfile() {
            const level = document.getElementById('setup-level').value;
            localStorage.setItem('yixiaokang_profile', JSON.stringify({ level }));
            document.getElementById('setup-modal').classList.add('hidden');
        }

        function loadListeningSentence() {
            const article = listeningArticles[currentArticleIndex];
            const sentence = article.sentences[currentSentenceIndex];
            
            document.getElementById('sentence-progress').innerText = `【${article.title}】进度：第 ${currentSentenceIndex + 1} / ${article.sentences.length} 句`;
            document.getElementById('current-sentence-text').innerText = sentence.en;
            
            const tagsContainer = document.getElementById('listening-tags');
            tagsContainer.innerHTML = sentence.tags.map(t => `<span class="tag-pill">${t}</span>`).join('');
            
            document.getElementById('listening-user-answer').value = '';
            document.getElementById('listening-feedback-area').style.display = 'none';
        }

        function playCurrentSentence() {
            const article = listeningArticles[currentArticleIndex];
            const sentence = article.sentences[currentSentenceIndex];
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(sentence.en);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            } else {
                alert('当前浏览器不支持内置语音朗读功能。');
            }
        }

        function nextSentence() {
            const article = listeningArticles[currentArticleIndex];
            currentSentenceIndex++;
            if (currentSentenceIndex >= article.sentences.length) {
                currentSentenceIndex = 0;
                alert('当前文章句子已学完，为您循环至第一句！');
            }
            loadListeningSentence();
        }

        function switchNextArticle() {
            currentArticleIndex = (currentArticleIndex + 1) % listeningArticles.length;
            currentSentenceIndex = 0;
            loadListeningSentence();
        }

        function submitListeningAnswer() {
            const userAnswer = document.getElementById('listening-user-answer').value.trim();
            if (!userAnswer) {
                alert('请先输入你的中文译文！');
                return;
            }
            const article = listeningArticles[currentArticleIndex];
            const sentence = article.sentences[currentSentenceIndex];

            document.getElementById('listening-feedback-score').innerText = '评分：90 / 100 分 (专业级表现)';
            document.getElementById('listening-feedback-comment').innerText = '核心术语准确，顺句驱动表现良好。';
            document.getElementById('listening-reference-answer').innerText = sentence.zh;
            document.getElementById('listening-feedback-area').style.display = 'block';
        }

        function toggleDone(moduleKey) {
            completedSteps[moduleKey] = !completedSteps[moduleKey];
            updateStats();
        }

        function updateStats() {
            const statusEl = document.getElementById('checkin-status');
            if (completedSteps.listening) {
                statusEl.innerText = '✨ 今日已完成';
                statusEl.style.color = '#27ae60';
            } else {
                statusEl.innerText = '❌ 未打卡';
                statusEl.style.color = '#95a5a6';
            }
        }

        function resetProfile() {
            localStorage.removeItem('yixiaokang_profile');
            document.getElementById('setup-modal').classList.remove('hidden');
        }
    </script>
</body>
</html>
